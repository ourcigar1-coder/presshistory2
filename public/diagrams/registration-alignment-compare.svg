<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="serif">
  <rect width="780" height="360" fill="#faf7f2"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" fill="#1c1a17" font-weight="700">같은 세 개의 원, 세 가지 정합</text>

  <!-- panel 1: aligned -->
  <g transform="translate(40,64)">
    <rect width="210" height="210" rx="10" fill="#ffffff" stroke="#e8e2d8" stroke-width="2"/>
    <circle cx="105" cy="112" r="54" fill="#06b6d4" opacity="0.6"/>
    <circle cx="105" cy="112" r="54" fill="#ec4899" opacity="0.45"/>
    <circle cx="105" cy="112" r="54" fill="#facc15" opacity="0.4"/>
    <circle cx="105" cy="112" r="54" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
    <g stroke="#1c1a17" stroke-width="1.8">
      <line x1="92" y1="28" x2="118" y2="28"/>
      <line x1="105" y1="15" x2="105" y2="41"/>
      <circle cx="105" cy="28" r="6" fill="none"/>
    </g>
    <text x="105" y="248" text-anchor="middle" font-size="15" fill="#166534" font-weight="700">정합 (in register)</text>
    <text x="105" y="268" text-anchor="middle" font-size="11" fill="#57534e">십자 마크가 겹친다</text>
  </g>

  <!-- panel 2: slightly off -->
  <g transform="translate(285,64)">
    <rect width="210" height="210" rx="10" fill="#ffffff" stroke="#e8e2d8" stroke-width="2"/>
    <circle cx="100" cy="116" r="54" fill="#06b6d4" opacity="0.6"/>
    <circle cx="111" cy="109" r="54" fill="#ec4899" opacity="0.45"/>
    <circle cx="103" cy="105" r="54" fill="#facc15" opacity="0.4"/>
    <circle cx="104" cy="110" r="54" fill="none" stroke="#1c1a17" stroke-width="1" stroke-dasharray="3 3"/>
    <g stroke="#1c1a17" stroke-width="1.8">
      <line x1="92" y1="28" x2="118" y2="28"/>
      <line x1="105" y1="15" x2="105" y2="41"/>
      <circle cx="105" cy="28" r="6" fill="none"/>
    </g>
    <text x="105" y="248" text-anchor="middle" font-size="15" fill="#92400e" font-weight="700">살짝 어긋남</text>
    <text x="105" y="268" text-anchor="middle" font-size="11" fill="#57534e">가장자리에 색 번짐</text>
  </g>

  <!-- panel 3: badly off -->
  <g transform="translate(530,64)">
    <rect width="210" height="210" rx="10" fill="#ffffff" stroke="#e8e2d8" stroke-width="2"/>
    <circle cx="84" cy="128" r="54" fill="#06b6d4" opacity="0.6"/>
    <circle cx="128" cy="98" r="54" fill="#ec4899" opacity="0.45"/>
    <circle cx="98" cy="138" r="54" fill="#facc15" opacity="0.4"/>
    <g stroke="#1c1a17" stroke-width="1.8">
      <line x1="92" y1="28" x2="118" y2="28"/>
      <line x1="105" y1="15" x2="105" y2="41"/>
      <circle cx="105" cy="28" r="6" fill="none"/>
    </g>
    <text x="105" y="248" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="700">크게 어긋남 (misregister)</text>
    <text x="105" y="268" text-anchor="middle" font-size="11" fill="#57534e">형체를 알아볼 수 없다</text>
  </g>

  <text x="390" y="344" text-anchor="middle" font-size="13" fill="#57534e">색판마다 같은 십자 눈금을 겨눠 종이를 다시 놓는다 — 워홀은 이 어긋남을 미학으로 썼다</text>
</svg>
